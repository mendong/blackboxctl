name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: tools/blackboxctl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Self-test
        run: python -m blackboxctl selftest
      - name: Doctor
        run: python -m blackboxctl --json doctor
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: |
          ruff format --check blackboxctl tests
          ruff check blackboxctl tests
